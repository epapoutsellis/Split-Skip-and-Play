name: ssp

channels:
  - conda-forge

dependencies:
  - python=3.12
  - "numpy<2.0"
  - "zarr<3"
  - cmake
  - scipy
  - six
  - cython
  - numba
  - pillow
  - pywavelets
  - astra-toolbox
  - tqdm
  - "setuptools<82"
  - wheel

  # Install these with conda, not pip
  - xdesign
  - scikit-image

  - pip
  - pip:
      - bm3d==4.0.3
